name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  get_changed_libs:
    runs-on: ubuntu-latest
    outputs:
      libs: ${{ steps.filter.outputs.changes }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v2
      id: filter
      with:
        filters: |
          jump_babel:
            - "libs/jump_babel/**"
          jump_portrait:
            - "libs/jump_portrait/**"
          trommel:
            - "libs/trommel/**"
          # jump_rr:
          #   - "libs/jump_rr/**"

  test:
    needs: get_changed_libs
    if: needs.get_changed_libs.outputs.libs != '[]'
    name: Test ${{ matrix.library }} on ubuntu-latest with Python 3.11
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        library: ${{ fromJson(needs.get_changed_libs.outputs.libs) }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v5
        id: setup-uv
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          cd libs/${{ matrix.library }}
          uv sync --all-groups
      - name: Test
        run: |
          cd libs/${{ matrix.library }}
          uv sync --all-groups
          pytest --markdown-docs --cov --color=yes --cov-report=xml -s
