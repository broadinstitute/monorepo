name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

  test:
    name: Test ${{ matrix.library }} on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        library: ["jump_babel", "jump_portrait", "trommel"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v5
        id: setup-uv
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          cd libs/${{ matrix.library }}
          uv sync --all-groups
      - name: Test
        run: |
          cd libs/${{ matrix.library }}
          uv sync --all-groups
          uv run pytest --markdown-docs --cov --color=yes --cov-report=xml -s
          
