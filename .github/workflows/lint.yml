name: Lint
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  flake-check:
    name: "Check monorepo linting"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Check Formatting
        run: |
          nix fmt 
          git diff --exit-code
      - name: Run Flake Check
        run: |
          nix flake check
