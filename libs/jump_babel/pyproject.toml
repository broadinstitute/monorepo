[project]
name = "broad-babel"
version = "0.1.28"
description = "A translator of Broad and JUMP ids to more conventional names."
authors = [{ name = "Alan Munoz" }]
requires-python = ">=3.10,<3.15"
readme = "README.md"
dependencies = [
    "pooch>=1.7.0,<2",
    "polars>=1.5.0,<2",
    "adbc-driver-sqlite>=0.8.0,<0.9",
]

[project.urls]
Homepage = "https://github.com/broadinstitute/monorepo/tree/main/libs/jump_babel"

[dependency-groups]
datagen = [
    "pyarrow>=23.0.1",
]
dev = [
    "jupytext>=1.15.0,<2",
    "ipdb>=0.13.13,<0.14",
    "jupyter>=1.0.0,<2",
    "tqdm>=4.66.1,<5",
    "ruff<0.2.0",
]
test = [
    "pytest>=7.4.1,<8",
    "pytest-cov",
    "pytest-markdown-docs",
]

[tool.hatch.build.targets.sdist]
include = ["src/broad_babel"]

[tool.hatch.build.targets.wheel]
include = ["src/broad_babel"]

[tool.hatch.build.targets.wheel.sources]
"src/broad_babel" = "broad_babel"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

