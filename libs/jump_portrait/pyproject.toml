[project]
name = "jump-portrait"
version = "0.1.1"
description = "Tools to fetch and visualize JUMP images"
authors = [{ name = "Alan Munoz" }]
requires-python = ">=3.10,<3.15"
readme = "README.md"
dependencies = [
    "boto3>=1.33.1",
    "broad-babel>=0.1.31",
    "joblib>=1.3.2,<2",
    "pooch>=1.7.0,<2",
    "pyarrow>=23.0.1",
    "s3path>=0.5.0,<0.6",
    "tqdm>=4.66.1,<5",
    "s3fs>=2024.6.0,<2025",
    "numpy>1.25",
    "duckdb>=1.4.4",
    "matplotlib>=3.8.2,<4",
    "imagecodecs-numcodecs==2024.6.1; python_version >= '3.11'",
    "obspec-utils>=0.9.0,<0.10; python_version >= '3.11'",
    "obstore>=0.11.0,<0.12; python_version >= '3.11'",
    "virtual-tiff>=0.5.0,<0.6; python_version >= '3.11'",
    "virtualizarr>=2.5.1,<2.6; python_version >= '3.11'",
    "xarray>=2025.6.0,<2027; python_version >= '3.11'",
    "zarr==3.1.5; python_version >= '3.11'",
]

[dependency-groups]
dev = [
    "jupyter>=1.0.0",
]
test = [
    "pytest>=7.4.4",
    "pytest-cov",
    "pytest-markdown-docs",
]

[tool.hatch.build.targets.sdist]
include = ["src/jump_portrait"]

[tool.hatch.build.targets.wheel]
include = ["src/jump_portrait"]

[tool.hatch.build.targets.wheel.sources]
"src/jump_portrait" = "jump_portrait"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
lint.select = ["ANN", "C90", "D", "E", "F", "I", "N", "NPY", "PTH", "TID", "UP", "W"]
lint.ignore = ["D212", "D203", "E501"]
exclude = ["vendor"]

[tool.ruff.lint.per-file-ignores]
# Ignore all directories named `tests`.
"tests/**" = ["D"]
# Ignore all files that end in `_test.py`.
"*_test.py" = ["D"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests", "README.md"]
